name: LC 2.0 CD
run-name: LC 2.0 Content-Delivery
on:
  # Pipeline dependency
  workflow_run:
    workflows: [LC 2.0 CI]
    types: [completed]
    branches: [main]
env:
  # Vercel
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
jobs:
  deploy-backend:
    runs-on: ubuntu-latest
     # Pipeline Check
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Get dependencies
      - name: Getting dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: ./node_modules
          key: modules-${{ hashFiles('package-lock.json') }}
      # Download stored project
      - name: Getting project artifacts
        uses: actions/download-artifact@v4
        with:
          name: lc-2.0-production
      - name: Deploy Backend
        run: npm run deploy
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v2
      - name: Install Vercel CLI
        run: npm i --g vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN_LC }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN_LC }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN_LC }}
  failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'The triggering workflow failed'
