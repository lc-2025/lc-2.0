name: LC 2.0 CI
run-name: LC 2.0 Content-Integration
on:
  push:
    branches: [main]
  # For collaborations
  pull_request:
    branches: [main]
env:
  # Frontend
  FRONTEND_URL: ${{ vars.FRONTEND_URL }}
  # Backend
  NEXT_PUBLIC_API_VERSION: ${{ vars.NEXT_PUBLIC_API_VERSION }}
  NEXT_PUBLIC_DATASET: ${{ vars.NEXT_PUBLIC_DATASET }}
  NEXT_PUBLIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PROJECT_ID }}
  # Analytics
  NEXT_PUBLIC_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_ANALYTICS_ID }}
  # Repository - TODO: Abstract to pass via `vars`
  DEPENDENCIES_PATH: |
    ~/.cache
    ./node_modules
  DEPENDENCIES_PATH_PRODUCTION: |
    ~/.npm
    ${{ github.workspace }}/.next/cache
  DEPENDENCIES_KEY: '**/package-lock.json'
  DEPENDENCIES_KEY_PRODUCTION: 'nextjs'
  DEPENDENCIES_KEY_PRODUCTION_EXTENSIONS: "'**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx'"
  ARTIFACTS_NAME: lc-2.0
  ARTIFACTS_PATH: |
    ./backend
    ./frontend
    ./package*
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - name: Create `env` file and provide environment variables
        run: |
          touch .env
          echo FRONTEND_URL=$BASE_URL >> .env
          echo NEXT_PUBLIC_API_VERSION=$NEXT_PUBLIC_API_VERSION >> .env
          echo NEXT_PUBLIC_PROJECT_ID=$NEXT_PUBLIC_PROJECT_ID >> .env
          echo NEXT_PUBLIC_DATASET=$NEXT_PUBLIC_DATASET >> .env
          echo NEXT_PUBLIC_ANALYTICS_ID=$NEXT_PUBLIC_ANALYTICS_ID >> .env
          mv .env frontend/
      - name: Installing dependencies
        run: npm run setup:ci
      # Cache dependencies for future reuse
      - name: Cache dependencies
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DEPENDENCIES_PATH }}
          # Generate a new cache whenever packages or source files change.
          key: modules-${{ hashFiles(env.DEPENDENCIES_KEY) }}
      # Store project for future reuse
      - name: Archive project artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACTS_NAME }}
          # i.e. dotfiles
          include-hidden-files: true
          # Exclude dependencies to lighten artifacts (provided via cache)
          path: ${{ env.ARTIFACTS_PATH }}
  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Getting dependencies & project artifacts
        uses: ./.github/actions/dependencies
        with:
          dependencies-path: ${{ env.DEPENDENCIES_PATH }}
          dependencies-key: ${{ env.DEPENDENCIES_KEY }}
          artifacts-name: ${{ env.ARTIFACTS_NAME }}
      - name: Test applications - Unit/Integration
        run: npm run test
      - name: Test applications - E2E
        uses: cypress-io/github-action@v6
        with:
          project: ./frontend
          build: npm run build -w frontend
          start: npm run start -w frontend
      # Tests report storing for QA/checks
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: lc-2.0-test
          path: ./**/coverage/**/*
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Getting dependencies & project artifacts
        uses: ./.github/actions/dependencies
        with:
          dependencies-path: ${{ env.DEPENDENCIES_PATH }}
          dependencies-key: ${{ env.DEPENDENCIES_KEY }}
          artifacts-name: ${{ env.ARTIFACTS_NAME }}
      - name: Build packages
        run: npm run build
      - name: Cache production dependencies
        uses: ./.github/actions/dependencies
        with:
          dependencies-path: ${{ env.DEPENDENCIES_PATH_PRODUCTION }}
          dependencies-key: ${{ env.DEPENDENCIES_KEY_PRODUCTION }}
          dependencies-key-extensions: ${{ env.DEPENDENCIES_KEY_PRODUCTION_EXTENSIONS }}
          production: true
      # Store production versions for future reuse
      - name: Archive production verions
        uses: actions/upload-artifact@v4
        with:
          name: lc-2.0-production
          include-hidden-files: true
          path: ${{ env.ARTIFACTS_PATH }}
